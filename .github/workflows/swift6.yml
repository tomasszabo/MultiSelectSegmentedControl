name: Swift 6
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        run: |
          xcodebuild -scheme MultiSelectSegmentedControl -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/Apple CODE_SIGNING_ALLOWED=NO build
      - name: Run selection tests
        run: |
          set -eu
          device_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d["udid"] for runtime, items in devices.items()
                    if "iOS" in runtime for d in items if d["name"].startswith("iPhone")]
          if not phones:
              sys.exit("No available iPhone simulator")
          print(phones[0])
          ')
          xcodebuild -scheme MultiSelectSegmentedControl \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath .build/Apple CODE_SIGNING_ALLOWED=NO test
